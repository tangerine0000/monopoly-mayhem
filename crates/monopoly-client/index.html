<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Tỷ Phú Sài Gòn - Vietnamese Monopoly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,350;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #e11d48;
            --accent-hover: #be123c;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Responsive Layouts */
        .game-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 16px;
            padding: 16px;
            max-width: 1700px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 20px);
        }

        @media (max-width: 1200px) {
            .game-layout {
                grid-template-columns: 260px 1fr;
            }
            .right-column {
                display: none;
            }
        }

        @media (max-width: 850px) {
            .game-layout {
                display: flex;
                flex-direction: column;
                height: auto;
                padding: 8px;
                gap: 12px;
            }
        }

        .panel {
            background: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: #3b82f6;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #2563eb;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-outline:hover:not(:disabled) {
            background-color: var(--surface-hover);
        }

        input {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent);
        }

        /* SVG Board styling */
        .board-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        svg.board-svg {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
            border-radius: 14px;
        }

        .tile-rect {
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .tile-rect:hover {
            opacity: 0.9;
        }

        .pawn-marker {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Turn countdown timer bar */
        .timer-container {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
            transition: width 1s linear;
        }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
