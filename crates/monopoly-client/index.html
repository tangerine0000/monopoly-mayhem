<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ tỷ phú Sài Gòn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deepest: #12110f;
            --bg-color: #161513;
            --surface-color: #1c1a18;
            --surface-hover: #262421;
            --text-main: #efe9de;
            --text-sub: #aaa398;
            --text-muted: #8a847a;
            --accent: #d9383a;
            --accent-hover: #b82d2f;
            --border: rgba(239, 233, 222, 0.08);
            --border-strong: rgba(239, 233, 222, 0.14);
            --success: #4cc38a;
            --warning: #d49b35;
            --danger: #e5484d;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --font-sans: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-display: 'Barlow Condensed', 'Barlow', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-size: 14px;
            line-height: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        .tabular {
            font-variant-numeric: tabular-nums;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .game-header {
            background: #1c1a18;
            border-bottom: 1px solid var(--border);
            min-height: 56px;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
            z-index: 30;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Full-viewport Playzone Stage (Control sidebar removed) */
        .game-layout {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px 84px 16px;
            width: 100%;
            height: calc(100dvh - 56px);
            overflow: hidden;
            background: linear-gradient(160deg, #8fb8de 0%, #a8cae8 52%, #bfd9f2 100%);
        }

        /* Floating Bottom Dice Roll & Contextual Action HUD */
        .floating-dice-hud {
            position: absolute;
            bottom: max(16px, env(safe-area-inset-bottom, 16px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(22, 38, 58, 0.92);
            border: 1px solid rgba(239, 233, 222, 0.22);
            padding: 8px 12px;
            border-radius: 999px;
            box-shadow: 0 12px 30px rgba(20, 44, 74, 0.35);
            backdrop-filter: blur(10px);
            max-width: calc(100vw - 24px);
        }

        .btn-roll-dice {
            background: linear-gradient(180deg, #e5484d 0%, #c92a2f 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 999px;
            height: 44px;
            padding: 0 24px;
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(217, 56, 58, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform 150ms var(--ease-out), filter 150ms var(--ease-out), opacity 150ms var(--ease-out);
            white-space: nowrap;
        }

        .btn-roll-dice:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .btn-roll-dice:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-roll-dice:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-hud-pill {
            height: 38px;
            padding: 0 14px;
            border-radius: 999px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            transition: background-color 150ms var(--ease-out), transform 150ms var(--ease-out);
        }

        .btn-hud-pill:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-hud-buy {
            background: #4cc38a;
            color: #12110f;
            border: none;
        }

        .btn-hud-buy:hover:not(:disabled) {
            background: #5fd19a;
        }

        .btn-hud-secondary {
            background: var(--surface-hover);
            color: var(--text-main);
            border: 1px solid var(--border-strong);
        }

        .btn-hud-secondary:hover:not(:disabled) {
            background: #33302c;
        }

        /* Toggleable History Popover Drawer */
        .history-popover-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(12, 11, 10, 0.45);
            z-index: 35;
        }

        .history-popover {
            position: fixed;
            top: 64px;
            right: 16px;
            width: min(380px, calc(100vw - 24px));
            max-height: min(480px, calc(100dvh - 140px));
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--surface-color);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.78);
            animation: lobby-fade-in 180ms var(--ease-out) forwards;
        }

        .history-popover .panel {
            border: none;
            padding: 0;
            background: transparent;
            flex: 1 1 auto !important;
            flex-shrink: 1 !important;
            min-height: 0 !important;
            max-height: 100%;
            overflow: hidden;
        }

        /* Lobby Asymmetric Split Layout */
        .lobby-shell {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .lobby-grid {
            display: grid;
            grid-template-columns: minmax(0, 420px) minmax(0, 460px);
            gap: 32px;
            max-width: 912px;
            width: 100%;
            align-items: center;
        }

        @media (max-width: 900px) {
            .lobby-shell {
                align-items: flex-start;
                padding: 16px 12px;
            }
            .lobby-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .game-header {
                padding: 6px 12px;
                min-height: 50px;
                gap: 6px;
            }
            .header-title-text {
                font-size: 14px !important;
            }
            .header-room-badge {
                display: none !important;
            }
            .game-layout {
                height: calc(100dvh - 50px);
                padding: 6px 6px 82px 6px;
            }
            .board-camera-hud {
                top: 6px;
                left: 6px;
                padding: 3px;
                gap: 3px;
            }
            .cam-btn {
                height: 26px;
                padding: 0 8px;
                font-size: 11px;
            }
            .board-aspect-frame.view-3d-tabletop {
                transform: rotateX(20deg) rotateZ(0deg) scale(0.95) translateY(-4px);
            }
            .board-aspect-frame.view-3d-iso {
                transform: rotateX(24deg) rotateZ(-10deg) scale(0.89) translateY(-6px);
            }
            .floating-dice-hud {
                bottom: max(10px, env(safe-area-inset-bottom, 10px));
                padding: 6px 10px;
                gap: 6px;
                border-radius: 20px;
                flex-wrap: wrap;
                width: max-content;
                max-width: calc(100vw - 16px);
            }
            .btn-roll-dice {
                height: 40px;
                padding: 0 18px;
                font-size: 15px;
            }
            .btn-hud-pill {
                height: 36px;
                padding: 0 12px;
                font-size: 12px;
            }
            .history-popover {
                top: 56px;
                right: 12px;
                left: 12px;
                width: auto;
                max-height: calc(100dvh - 140px);
            }
        }

        .panel {
            background: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .lobby-card-enter {
            animation: lobby-fade-in 320ms var(--ease-out) forwards;
        }

        @keyframes lobby-fade-in {
            0%   { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .btn {
            background-color: var(--text-main);
            color: var(--bg-deepest);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 16px;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
            cursor: pointer;
            transition: background-color 150ms var(--ease-out), border-color 150ms var(--ease-out), color 150ms var(--ease-out), transform 150ms var(--ease-out), opacity 150ms var(--ease-out);
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .btn:hover:not(:disabled) {
            background-color: #dcd5c7;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:focus-visible {
            outline: 2px solid var(--warning);
            outline-offset: 2px;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: var(--surface-hover);
            color: var(--text-main);
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #302d29;
            border-color: var(--border-strong);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            box-shadow: none;
        }

        .btn-outline:hover:not(:disabled) {
            background-color: var(--surface-hover);
            border-color: var(--border-strong);
        }

        input {
            background-color: var(--bg-deepest);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            height: 40px;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 20px;
            outline: none;
            width: 100%;
            transition: border-color 150ms var(--ease-out), background-color 150ms var(--ease-out);
        }

        input:focus {
            border-color: var(--border-strong);
            background-color: #181714;
        }

        /* SVG Board & 3D Tabletop Model Frame */
        .board-container {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            isolation: isolate;
            container-type: size;
            perspective: 1350px;
            overflow: visible;
        }

        .board-camera-hud {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 20;
            display: flex;
            gap: 6px;
            background: rgba(22, 38, 58, 0.92);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid rgba(239, 233, 222, 0.22);
            box-shadow: 0 8px 20px rgba(20, 44, 74, 0.25);
            backdrop-filter: blur(8px);
        }

        .cam-btn {
            height: 28px;
            padding: 0 10px;
            border-radius: 6px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
        }

        .cam-btn:hover {
            color: var(--text-main);
            background: rgba(239, 233, 222, 0.08);
        }

        .cam-btn.active {
            background: var(--text-main);
            color: var(--bg-deepest);
            font-weight: 600;
        }

        .board-aspect-frame {
            position: relative;
            width: min(100cqw, calc(100cqh * 4 / 3));
            height: min(100cqh, calc(100cqw * 3 / 4));
            border-radius: 12px;
            transform-style: preserve-3d;
            transition: transform 520ms var(--ease-out), box-shadow 520ms var(--ease-out);
        }

        .board-aspect-frame.view-3d-tabletop {
            transform: rotateX(28deg) rotateZ(0deg) scale(0.92) translateY(-10px);
            box-shadow: 0 22px 0 -2px #213b5c, 0 26px 0 -2px #14263d, 0 38px 54px rgba(18, 42, 72, 0.38);
        }

        .board-aspect-frame.view-2d-flat {
            transform: rotateX(0deg) rotateZ(0deg) scale(1);
            box-shadow: 0 18px 42px rgba(18, 42, 72, 0.32);
        }

        .board-aspect-frame::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -18px;
            height: 18px;
            background: linear-gradient(180deg, #274469 0%, #14263d 100%);
            border-radius: 0 0 12px 12px;
            transform-origin: top center;
            transform: rotateX(-75deg);
            pointer-events: none;
            opacity: 0.95;
            transition: opacity 400ms var(--ease-out);
        }

        .board-aspect-frame.view-2d-flat::after {
            opacity: 0;
        }

        svg.board-svg {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 12px;
            border: 1px solid rgba(20, 38, 61, 0.45);
        }

        .tile-rect {
            cursor: pointer;
            transition: opacity 150ms var(--ease-out);
        }

        .tile-rect:hover .tile-base-rect {
            fill: #f2ead8;
        }

        .tile-base-rect {
            transition: fill 150ms var(--ease-out), stroke 150ms var(--ease-out), stroke-width 150ms var(--ease-out);
        }

        /* Smooth Step-by-Step Pawn Translation & Hop Arc */
        .pawn-marker {
            transition: transform 115ms var(--ease-out);
            will-change: transform;
            cursor: pointer;
        }

        .pawn-body.hopping {
            animation: pawn-hop-arc 115ms var(--ease-out) infinite;
        }

        .pawn-shadow.hopping {
            animation: pawn-shadow-hop 115ms var(--ease-out) infinite;
        }

        @keyframes pawn-hop-arc {
            0%   { transform: translateY(0px); }
            50%  { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pawn-shadow-hop {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50%      { transform: scale(0.65); opacity: 0.25; }
        }

        /* Destination Tile Landing Ring & Property Acquisition */
        .landing-shockwave-ring {
            animation: tile-landing-ripple 480ms var(--ease-out) forwards;
            transform-box: fill-box;
            transform-origin: center;
            pointer-events: none;
        }

        @keyframes tile-landing-ripple {
            0%   { transform: scale(0.6); opacity: 0.85; }
            100% { transform: scale(1.45); opacity: 0; }
        }

        .owner-badge-pop {
            animation: owner-badge-stamp 300ms var(--ease-out) forwards;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes owner-badge-stamp {
            0%   { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .house-icon-pop {
            animation: house-build-enter 300ms var(--ease-out) forwards;
            transform-box: fill-box;
            transform-origin: bottom center;
        }

        @keyframes house-build-enter {
            0%   { transform: translateY(-6px); opacity: 0; }
            100% { transform: translateY(0px); opacity: 1; }
        }

        /* Floating Cash Delta on Board & Sidebar */
        .svg-cash-float {
            animation: svg-cash-float-up 1400ms var(--ease-out) forwards;
            pointer-events: none;
        }

        @keyframes svg-cash-float-up {
            0%   { opacity: 0; transform: translateY(6px); }
            15%  { opacity: 1; transform: translateY(-4px); }
            80%  { opacity: 1; transform: translateY(-20px); }
            100% { opacity: 0; transform: translateY(-28px); }
        }

        .ui-cash-delta {
            animation: ui-cash-delta-pop 1400ms var(--ease-out) forwards;
            display: inline-block;
        }

        @keyframes ui-cash-delta-pop {
            0%   { opacity: 0; transform: translateY(4px); }
            20%  { opacity: 1; transform: translateY(0); }
            80%  { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-4px); }
        }

        .cash-pill-gain {
            animation: cash-flash-gain 600ms var(--ease-out);
        }

        .cash-pill-loss {
            animation: cash-flash-loss 600ms var(--ease-out);
        }

        @keyframes cash-flash-gain {
            0%   { background-color: rgba(76, 195, 138, 0.2); }
            100% { background-color: var(--bg-deepest); }
        }

        @keyframes cash-flash-loss {
            0%   { background-color: rgba(229, 72, 77, 0.2); }
            100% { background-color: var(--bg-deepest); }
        }

        /* True 3D CSS Cube Dice Overlay */
        .dice-3d-overlay {
            position: absolute;
            /* Centered on the SVG tray: x=536..744 (center 640 = 50%), y=210..298 (center 254 = 26.458%) */
            left: 50%;
            top: 26.458%;
            transform: translate3d(-50%, -50%, 28px);
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 2.2cqw, 30px);
            pointer-events: auto;
            cursor: pointer;
            z-index: 5;
            --die-size: clamp(28px, 3.6cqw, 46px);
            --die-half: calc(var(--die-size) / 2);
        }

        .die-scene {
            width: var(--die-size);
            height: var(--die-size);
            perspective: 560px;
            position: relative;
            transform-style: preserve-3d;
        }

        .die-shadow {
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: -18%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 72%);
            transform: translateZ(-24px);
            transition: transform 300ms var(--ease-out), opacity 300ms var(--ease-out);
        }

        .die-shadow.rolling {
            animation: die-shadow-bounce 620ms ease-in-out infinite;
        }

        @keyframes die-shadow-bounce {
            0%, 100% { transform: translateZ(-24px) scale(1); opacity: 0.6; }
            50%      { transform: translateZ(-24px) scale(0.62); opacity: 0.22; }
        }

        .die-cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 480ms var(--ease-out);
        }

        .die-cube.rolling-left {
            animation: dice-tumble-3d-left 620ms linear infinite;
            transition: none;
        }

        .die-cube.rolling-right {
            animation: dice-tumble-3d-right 620ms linear infinite;
            transition: none;
        }

        @keyframes dice-tumble-3d-left {
            0%   { transform: translate3d(0px, 0px, 0px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            25%  { transform: translate3d(-4px, -18px, 32px) rotateX(180deg) rotateY(90deg) rotateZ(45deg); }
            50%  { transform: translate3d(4px, -4px, 12px) rotateX(360deg) rotateY(220deg) rotateZ(120deg); }
            75%  { transform: translate3d(-2px, -14px, 28px) rotateX(540deg) rotateY(310deg) rotateZ(240deg); }
            100% { transform: translate3d(0px, 0px, 0px) rotateX(720deg) rotateY(360deg) rotateZ(360deg); }
        }

        @keyframes dice-tumble-3d-right {
            0%   { transform: translate3d(0px, 0px, 0px) rotateX(15deg) rotateY(30deg) rotateZ(0deg); }
            25%  { transform: translate3d(4px, -20px, 36px) rotateX(-165deg) rotateY(150deg) rotateZ(-60deg); }
            50%  { transform: translate3d(-4px, -2px, 10px) rotateX(-345deg) rotateY(270deg) rotateZ(-160deg); }
            75%  { transform: translate3d(2px, -15px, 26px) rotateX(-525deg) rotateY(340deg) rotateZ(-260deg); }
            100% { transform: translate3d(0px, 0px, 0px) rotateX(-705deg) rotateY(390deg) rotateZ(-360deg); }
        }

        .die-face {
            position: absolute;
            inset: 0;
            border-radius: 18%;
            background: linear-gradient(145deg, #fbf8f1 0%, #ebe3d3 100%);
            border: 1px solid #bdb3a1;
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.14);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 15%;
            gap: 8%;
            backface-visibility: hidden;
        }

        .die-cube.doubles .die-face {
            border-color: #d49b35;
            box-shadow: inset 0 0 6px rgba(212, 155, 53, 0.25);
        }

        .die-face-1 { transform: rotateY(0deg) translateZ(var(--die-half)); }
        .die-face-2 { transform: rotateY(90deg) translateZ(var(--die-half)); }
        .die-face-3 { transform: rotateX(90deg) translateZ(var(--die-half)); }
        .die-face-4 { transform: rotateX(-90deg) translateZ(var(--die-half)); }
        .die-face-5 { transform: rotateY(-90deg) translateZ(var(--die-half)); }
        .die-face-6 { transform: rotateY(180deg) translateZ(var(--die-half)); }

        .die-pip {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1c1a18;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
            align-self: center;
            justify-self: center;
        }

        .die-pip.red {
            background: #d9383a;
        }

        .die-pip.big-one {
            transform: scale(1.45);
        }

        /* Title Deed & Drawn Card Entrance Animations */
        @keyframes deed-pop-in {
            0%   { opacity: 0; transform: translate(352px, 408px); }
            100% { opacity: 1; transform: translate(352px, 400px); }
        }

        .deed-card-group {
            animation: deed-pop-in 240ms var(--ease-out) forwards;
        }

        @keyframes card-banner-flip-in {
            0%   { opacity: 0; transform: translate(332px, 348px); }
            100% { opacity: 1; transform: translate(332px, 340px); }
        }

        .card-banner-group {
            animation: card-banner-flip-in 240ms var(--ease-out) forwards;
        }

        /* Phase Action Buttons & Log Entry Animations */
        .phase-action-group {
            animation: phase-enter 200ms var(--ease-out) forwards;
        }

        @keyframes phase-enter {
            0%   { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .log-item-enter {
            animation: log-slide-in 200ms var(--ease-out) forwards;
        }

        @keyframes log-slide-in {
            0%   { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Turn countdown timer bar (quiet track, single semantic tone) */
        .timer-container {
            width: 100%;
            height: 4px;
            background: var(--bg-deepest);
            border-radius: 4px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: var(--text-sub);
            transition: transform 300ms var(--ease-out), background-color 150ms var(--ease-out);
            transform-origin: left center;
        }

        .timer-fill.urgent {
            background: var(--danger);
        }

        /* Quick Illustrated Rules Modal */
        .rules-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(12, 22, 36, 0.68);
            backdrop-filter: blur(4px);
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .rules-modal {
            width: min(680px, 100%);
            max-height: min(86dvh, 720px);
            background: #17273c;
            border: 1px solid rgba(212, 168, 83, 0.38);
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(8, 18, 32, 0.65);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: lobby-fade-in 180ms var(--ease-out) forwards;
        }

        .rules-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(239, 233, 222, 0.12);
            background: #132133;
            flex-shrink: 0;
        }

        .rules-list {
            list-style: none;
            margin: 0;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .rule-item {
            display: grid;
            grid-template-columns: 76px minmax(0, 1fr);
            gap: 14px;
            align-items: center;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(251, 247, 238, 0.05);
            border: 1px solid rgba(239, 233, 222, 0.12);
        }

        .rule-illust {
            width: 76px;
            height: 58px;
            border-radius: 8px;
            background: #dcefe8;
            border: 1px solid rgba(33, 53, 77, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .rule-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .rule-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .rule-step-badge {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: #d4a853;
            color: #14263d;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .rule-title {
            font-size: 15px;
            font-weight: 600;
            color: #fbf7ee;
        }

        .rule-desc {
            font-size: 13px;
            line-height: 19px;
            color: #c8d6e6;
        }

        @media (max-width: 560px) {
            .rules-modal-backdrop {
                padding: 10px;
            }
            .rules-list {
                padding: 12px;
                gap: 10px;
            }
            .rule-item {
                grid-template-columns: 64px minmax(0, 1fr);
                gap: 10px;
                padding: 10px;
            }
            .rule-illust {
                width: 64px;
                height: 52px;
            }
        }

        /* Lobby Mode Tabs */
        .lobby-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            border-radius: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border);
        }

        .lobby-tab {
            height: 36px;
            border-radius: 7px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
        }

        .lobby-tab.active {
            background: var(--surface-hover);
            color: var(--text-main);
            font-weight: 600;
        }

        /* Floating Player Standings Strip */
        .standings-strip {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: calc(100vw - 24px);
            pointer-events: auto;
        }

        .standing-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 10px 0 6px;
            border-radius: 999px;
            background: rgba(22, 38, 58, 0.88);
            border: 1px solid rgba(239, 233, 222, 0.18);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 12px rgba(15, 28, 46, 0.25);
            transition: border-color 150ms var(--ease-out), transform 150ms var(--ease-out);
        }

        .standing-pill.active {
            background: rgba(28, 48, 74, 0.96);
            border-color: #d4a853;
            box-shadow: 0 6px 16px rgba(212, 168, 83, 0.28);
        }

        .standing-pill.bankrupt {
            opacity: 0.52;
        }

        /* Online Waiting Room Overlay */
        .waiting-room-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(12, 18, 28, 0.62);
            backdrop-filter: blur(6px);
            z-index: 45;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .waiting-room-card {
            width: min(460px, 100%);
            background: var(--surface-color);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
            animation: lobby-fade-in 180ms var(--ease-out) forwards;
        }

        /* Always-2D Asset / Land & Deck Detail Card Overlay */
        .deed-2d-backdrop {
            position: absolute;
            inset: 0;
            z-index: 32;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(12, 18, 28, 0.42);
            backdrop-filter: blur(3px);
            pointer-events: auto;
        }

        .deed-2d-card {
            width: min(440px, 100%);
            max-height: min(540px, calc(100dvh - 140px));
            background: #1c1a18;
            border: 1px solid rgba(239, 233, 222, 0.16);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65);
            transform: none !important;
            animation: lobby-fade-in 160ms var(--ease-out) forwards;
        }

        .deed-2d-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .deed-2d-primary-box {
            padding: 14px 16px;
            border-radius: 10px;
            background: #24211e;
            border: 1px solid rgba(239, 233, 222, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .deed-2d-secondary-box {
            padding: 10px 14px;
            border-radius: 10px;
            background: #161513;
            border: 1px solid rgba(239, 233, 222, 0.07);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .deed-2d-tier-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .deed-2d-tier-row.active {
            background: rgba(212, 168, 83, 0.14);
            color: var(--text-main);
            font-weight: 600;
        }

        /* Center Board Stage (Decision, Auction, Drawn Card, Waiting Status) */
        .board-center-stage {
            position: absolute;
            top: 37%;
            left: 15%;
            right: 15%;
            bottom: 14.5%;
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            pointer-events: none;
        }

        .stage-card {
            pointer-events: auto;
            width: min(370px, 100%);
            background: rgba(24, 45, 70, 0.94);
            border: 1px solid rgba(212, 168, 83, 0.48);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 14px 34px rgba(10, 22, 38, 0.45);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--text-main);
            animation: lobby-fade-in 180ms var(--ease-out) forwards;
        }

        .stage-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .stage-district-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-main);
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
        }

        .stage-district-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .stage-price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .stage-reason {
            font-size: 12px;
            line-height: 17px;
            color: #d6e4f2;
            background: rgba(14, 28, 46, 0.55);
            border: 1px solid rgba(239, 233, 222, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
        }

        .stage-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stage-link-btn {
            background: transparent;
            border: none;
            color: #d4a853;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 2px 0;
            text-decoration: underline;
            text-underline-offset: 2px;
            align-self: flex-start;
        }

        .stage-link-btn:hover {
            color: #e6c478;
        }

        .stage-drawn-card {
            pointer-events: auto;
            width: min(360px, 100%);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 14px 32px rgba(10, 22, 38, 0.42);
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: lobby-fade-in 200ms var(--ease-out) forwards;
        }

        .stage-drawn-card.chance {
            background: #fbd7b5;
            border: 2px solid #c85a28;
            color: #18283a;
        }

        .stage-drawn-card.chest {
            background: #faecb8;
            border: 2px solid #b5851d;
            color: #18283a;
        }

        .stage-waiting-pill {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(24, 45, 70, 0.86);
            border: 1px solid rgba(212, 168, 83, 0.35);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(10, 22, 38, 0.3);
        }

        .stage-auction-bidders {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stage-bidder-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px 3px 4px;
            border-radius: 999px;
            background: rgba(14, 28, 46, 0.6);
            border: 1px solid rgba(239, 233, 222, 0.14);
            font-size: 11px;
            color: var(--text-main);
            transition: opacity 150ms var(--ease-out);
        }

        .stage-bidder-chip.leading {
            border-color: #d4a853;
            background: rgba(212, 168, 83, 0.16);
        }

        .stage-bidder-chip.passed {
            opacity: 0.4;
            text-decoration: line-through;
        }

        /* Standings District Progress Bars */
        .standing-districts {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 2px;
            flex-wrap: wrap;
        }

        .standing-district-bar {
            width: 12px;
            height: 4px;
            border-radius: 2px;
            opacity: 0.85;
        }

        .standing-district-bar.monopoly {
            width: 18px;
            height: 5px;
            opacity: 1;
            box-shadow: 0 0 0 1px rgba(239, 233, 222, 0.7);
        }

        /* Deed Inspector Action Bar */
        .deed-2d-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(239, 233, 222, 0.1);
        }

        .deed-2d-action-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .deed-2d-action-hint {
            font-size: 11px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .board-center-stage {
                top: 35%;
                left: 12%;
                right: 12%;
                bottom: 13%;
            }
            .stage-card {
                padding: 8px 10px;
                gap: 5px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <script>
        (function () {
            window.__monopolyMuted = false;
            var ctx = null;
            function getCtx() {
                if (window.__monopolyMuted) return null;
                if (!ctx) {
                    var AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        try { ctx = new AudioCtx(); } catch (_) {}
                    }
                }
                if (ctx && ctx.state === 'suspended') {
                    try { ctx.resume(); } catch (_) {}
                }
                return ctx;
            }
            function tone(freq, dur, type, gainVal, delay) {
                var c = getCtx();
                if (!c) return;
                var now = c.currentTime + (delay || 0);
                var osc = c.createOscillator();
                var gain = c.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(gainVal || 0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                osc.connect(gain);
                gain.connect(c.destination);
                osc.start(now);
                osc.stop(now + dur + 0.02);
            }
            window.setMonopolySoundMuted = function (muted) {
                window.__monopolyMuted = !!muted;
            };
            window.playMonopolySound = function (kind) {
                if (window.__monopolyMuted) return;
                switch (kind) {
                    case 'roll':
                        tone(220, 0.05, 'triangle', 0.05, 0);
                        tone(290, 0.05, 'triangle', 0.05, 0.06);
                        tone(250, 0.06, 'triangle', 0.05, 0.12);
                        break;
                    case 'step':
                        tone(520, 0.035, 'sine', 0.03, 0);
                        break;
                    case 'buy':
                        tone(523.25, 0.08, 'triangle', 0.07, 0);
                        tone(659.25, 0.12, 'triangle', 0.07, 0.07);
                        break;
                    case 'cash_in':
                        tone(659.25, 0.07, 'sine', 0.06, 0);
                        tone(880, 0.14, 'sine', 0.06, 0.07);
                        break;
                    case 'cash_out':
                        tone(330, 0.08, 'sine', 0.05, 0);
                        tone(247, 0.14, 'sine', 0.05, 0.07);
                        break;
                    case 'jail':
                        tone(440, 0.12, 'sawtooth', 0.04, 0);
                        tone(311, 0.2, 'sawtooth', 0.04, 0.13);
                        break;
                    case 'urgent':
                        tone(740, 0.04, 'sine', 0.035, 0);
                        break;
                    case 'win':
                        tone(523.25, 0.1, 'triangle', 0.07, 0);
                        tone(659.25, 0.1, 'triangle', 0.07, 0.1);
                        tone(783.99, 0.12, 'triangle', 0.07, 0.2);
                        tone(1046.5, 0.28, 'triangle', 0.08, 0.32);
                        break;
                }
            };
        })();
    </script>
</body>
