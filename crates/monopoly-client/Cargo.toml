[package]
name = "monopoly-client"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Storage",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "console"
] }
gloo-net = { version = "0.6", features = ["websocket"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
monopoly-proto = { path = "../monopoly-proto" }
monopoly-core = { path = "../monopoly-core" }
