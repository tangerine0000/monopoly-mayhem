[package]
name = "monopoly-core"
version = "0.1.0"
edition = "2021"

[dependencies]
monopoly-proto = { path = "../monopoly-proto" }
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4"] }
